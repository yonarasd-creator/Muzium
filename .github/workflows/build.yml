name: Sürüm yayınla
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Etiket package.json sürümüyle aynı mı?
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          if [ "v$V" != "${{ github.ref_name }}" ]; then
            echo "::error::Etiket ${{ github.ref_name }} ama package.json sürümü $V. Önce package.json'daki version değerini etikete eşitleyip merge et, sonra Release aç."
            exit 1
          fi
      - name: Google giriş kimliğini ekle (depoda tutulmaz, GitHub Secrets'tan gelir)
        shell: bash
        env:
          GCID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GSEC: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -n "$GCID" ]; then
            node -e "require('fs').writeFileSync('server/google.json', JSON.stringify({cid: process.env.GCID, sec: process.env.GSEC}))"
            echo "Google kimliği eklendi."
          else
            echo "::warning::GOOGLE_CLIENT_ID tanımlı değil, YouTube girişi bu sürümde çalışmaz."
          fi
      - run: npm install
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
