<script>

// ---- IndexedDB
const db=new Promise((ok,no)=>{const r=indexedDB.open('muzigim',1);r.onupgradeneeded=()=>{const d=r.result;['tracks','lists','blobs'].forEach(s=>d.createObjectStore(s,{keyPath:'id'}))};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});

 audius:async(q,p,n=30)=>{const u=q?`${API}/tracks/search?query=${encodeURIComponent(q)}&limit=${n}&offset=${p*n}&app_name=${APP}`:`${API}/tracks/trending?limit=${n}&offset=${p*n}&time=week${genre?'&genre='+encodeURIComponent(genre):''}&app_name=${APP}`;

  const sp=new URLSearchParams({client_id:k,format:'json',limit:n,offset:p*n,audioformat:'mp32',imagesize:200});

  const r=await fetch('https://api.jamendo.com/v3.0/tracks/?'+sp);if(!r.ok)throw 0;
  return ((await r.json()).results||[]).filter(t=>t.audio).map(t=>({id:'j'+t.id,title:t.name,artist:t.artist_name,art:t.image||'',url:t.audio,src:'Jamendo'}))},

  const sp=new URLSearchParams({q:`(${q}) AND mediatype:audio`,rows:6,page:p+1,output:'json'});

 const draw=()=>{a.innerHTML=`<div class="card" style="width:min(92vw,360px)"><h2 style="margin:0 0 4px">🎵 Yoni</h2><p class="muted" style="margin:0 0 12px">${reg?'Hesap oluştur':'Giriş yap'}</p>

  $('#sw').onclick=e=>{e.preventDefault();reg=!reg;draw()};
  $('#of').onclick=()=>{ME=null;offline=true;start()};
  const go=async()=>{try{ME=(await api('POST',reg?'/register':'/login',{username:$("#lu").value,password:$("#lp").value})).user;offline=false;lsSet('me',ME);if(ME.theme){Object.assign(TH,ME.theme);lsSet('theme',TH);applyVars(TH);setBg(TH)}start()}catch(e){$('#er').textContent=e instanceof TypeError?'Sunucuya ulaşılamıyor':e.message}};
  $('#go').onclick=go;$("#lp").onkeydown=e=>{if(e.key=='Enter')go()}};

function openLogo(id){

function parseCSV(s){const rows=[];let r=[],c='',q=0;for(let i=0;i<s.length;i++){const ch=s[i];
 if(q){if(ch=='"'){if(s[i+1]=='"'){c+='"';i++}else q=0}else c+=ch}
 else if(ch=='"')q=1;else if(ch==','||ch==';'){r.push(c);c=''}else if(ch=='\n'){r.push(c);rows.push(r);r=[];c=''}else if(ch!='\r')c+=ch}
 if(c||r.length){r.push(c);rows.push(r)}return rows}
function parseAny(txt,name){
 try{const j=JSON.parse(txt),a=Array.isArray(j)?j:(j.tracks||j.items||[]);
  return a.map(o=>{if(typeof o=='string')return split(o);o=o.track||o;return{title:o.title||o.name||o.trackName,artist:o.artist||o.artists?.[0]?.name||o.artistName||''}}).filter(x=>x.title)}catch{}
 if(/\.csv$/i.test(name)||txt.split('\n')[0].includes(',')){
  const rows=parseCSV(txt),h=rows[0].map(x=>x.toLowerCase());
  const ti=h.findIndex(x=>/track name|title|song|name/.test(x)),ai=h.findIndex(x=>/artist/.test(x));
  if(ti>=0)return rows.slice(1).map(r=>({title:r[ti],artist:(r[ai]||'').split(/[;,]/)[0]})).filter(x=>x.title)}
 return txt.split('\n').map(x=>x.trim()).filter(Boolean).map(split);
 function split(s){const p=s.split(/\s[-–]\s/);return p.length>1?{artist:p[0],title:p.slice(1).join(' - ')}:{title:s,artist:''}}}

  const l={id:'p'+Date.now(),name:f.name.replace(/\.[^.]+$/,''),ids:[]},miss=[],log=$('#log');let ok=0;
  for(let i=0;i<items.length;i++){log.innerHTML=`<div class="card">Eşleştiriliyor ${i+1}/${items.length}…</div>`;
   try{const qq=`${items[i].artist} ${items[i].title}`.trim();let r=await search(qq,1);if(!r[0]&&jkey())r=await S.jamendo(qq,0,1);if(r[0]){await addTo(l,[r[0]]);ok++}else miss.push(items[i])}catch{miss.push(items[i])}}
